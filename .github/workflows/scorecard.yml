# OpenSSF Scorecard — weekly supply-chain security scoring.
#
# Scores the repo on the OSSF Scorecard check suite (Branch-Protection,
# Code-Review, Dangerous-Workflow, Dependency-Update-Tool, Maintained,
# Pinned-Dependencies, SAST, Security-Policy, Signed-Releases,
# Token-Permissions, etc.) and uploads SARIF to the Security tab so findings
# sit next to CodeQL alerts.
#
# branch_protection_rule fires on ruleset changes, so regressions in the
# master ruleset are caught automatically. The push trigger keeps the score
# on the latest master commit, and the pull_request trigger lets
# `Scorecard analysis` be a required status check without deadlocking PRs.
#
# All actions are SHA-pinned (repo-level sha_pinning_required) to the COMMIT
# SHA, not the annotated-tag object SHA: the OpenSSF webapp's publish_results
# verifier rejects tag-object SHAs as "imposter commit". Comments are precise
# (# vX.Y.Z) so Dependabot tracks bumps; bare-major comments are a blind spot.
#
# Allowlist: allowed_actions=selected. ossf/scorecard-action@* is on
# patterns_allowed; actions/* and github/codeql-action/* are covered by
# github_owned_allowed=true.

name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '0 13 * * 1'
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # Upload SARIF results to the Security tab
      id-token: write          # OIDC for publish_results to api.securityscorecards.dev
      contents: read           # Read the checked-out repo
      actions: read            # Read workflow run metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to api.securityscorecards.dev (public viewer at
          # https://scorecard.dev/viewer/?uri=github.com/bilbospocketses/streamflex).
          # Push events only: a PR run would publish a branch-HEAD SHA that is
          # not on master yet, which the webapp verifier rejects.
          publish_results: ${{ github.event_name == 'push' }}

      - name: Upload SARIF artifact (for run-level inspection)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
