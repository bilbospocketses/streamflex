name: Build
on:
  # Only master and release tags. A PR branch is built by `pull_request`;
  # without this filter every PR commit ran the whole build twice. Tag pushes
  # trigger the Release job, and GitHub does not apply paths-ignore to them.
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      [
        "**/**.md"
      ]

  # No paths-ignore on pull_request: `build-and-test` is a required status
  # check on master, and a docs-only PR that skipped this workflow would never
  # report it and could never merge.
  pull_request:
    branches:
      - master

  workflow_dispatch:

defaults:
  run:
    shell: bash
env:
  # vcpkg 2026.07.29. The previous pin (10b7a17) fetched getopt-win32 from a
  # GitHub archive that now 404s, which broke the Windows build.
  VCPKG_COMMITTISH: 9e593bb18ea69cc5095e012465dcd675a822ed0d

# Read-only by default; only the release job widens its token.
# All actions are pinned to commit SHAs (repo-level sha_pinning_required) with
# precise `# vX.Y.Z` comments so Dependabot can track them.
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  issues: none
  packages: read
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: read

jobs:
  build_windows:
    name: Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false

    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_GENERATOR: Visual Studio 17 2022
      VCPKG_TRIPLET: x64-windows-static

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: friendlyanon/setup-vcpkg@508a6e6b59a3c9d8dac926e1281d4471160d624b # v1.7.0
        with:
          committish: ${{env.VCPKG_COMMITTISH}}

      # EXTRA_WARNINGS is /W4 /WX, so a new MSVC warning fails the build. It reaches only our own
      # targets: vcpkg builds its ports in a process of its own, with the triplet's flags
      - name: Configure
        run: cmake -B build -G "${{env.CMAKE_GENERATOR}}" -D "CMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TRIPLET}} -DEXTRA_WARNINGS=ON

      - name: Build
        run: cmake --build build --target package --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Unit tests
        run: ctest --test-dir build -C ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure

      - name: Check the icon library is beside the executable in the zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem build/*.zip | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
          $archive.Dispose()
          $exe = $names | Where-Object { $_ -match '(^|/)streamflex\.exe$' } | Select-Object -First 1
          if (-not $exe) { Write-Error "streamflex.exe is not in $($zip.Name)"; exit 1 }
          $prefix = $exe.Substring(0, $exe.Length - 'streamflex.exe'.Length)
          foreach ($want in 'assets/icons/library/icons.ini', 'assets/icons/library/brands/NOTICE.md', 'assets/icons/library/generic/apps.svg') {
            if ($names -notcontains ($prefix + $want)) { Write-Error "$prefix$want is not in $($zip.Name)"; exit 1 }
          }
          "icon library found beside streamflex.exe in $($zip.Name)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload package
        with:
          name: Windows build
          path: build/*.zip
          if-no-files-found: error

  build_linux:
    name: Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          # bookworm: bullseye is past end of life and its security mirror
          # now 404s on package downloads. Every Docker Hub image here comes
          # through mirror.gcr.io, Google's public Docker Hub mirror: Docker
          # Hub rate-limits the runners' unauthenticated pulls.
          - name: Debian
            docker_image: mirror.gcr.io/library/debian:bookworm
            package_ext: .deb

    container:
      image: ${{matrix.config.docker_image}}

    env:
      CMAKE_BUILD_TYPE: Release

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install dependencies"
        run: |
          if [[ "${{matrix.config.name}}" == "Debian" ]]; then
            apt update && apt install -y build-essential file git cmake pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libinih-dev
          fi

      - name: Build
        run: |
          if [[ "${{matrix.config.name}}" == "Debian" ]]; then
            cmake -B build -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=/usr -DPACKAGE=DEB -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64
            cmake --build build --target package --config ${{env.CMAKE_BUILD_TYPE}}
            ctest --test-dir build --output-on-failure
          fi

      - name: Show package metadata
        run: dpkg-deb -f build/*.deb Package Version Architecture Maintainer Depends Homepage

      - name: Check the icon library is in the package
        run: |
          contents=$(dpkg-deb -c build/*.deb)
          for want in usr/share/streamflex/assets/icons/library/icons.ini usr/share/streamflex/assets/icons/library/brands/NOTICE.md usr/share/streamflex/assets/icons/library/generic/apps.svg; do
            grep -q "\./$want\$" <<< "$contents" || { echo "::error::$want is not in the package"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload Package
        with:
          name: Debian build
          path: build/*${{matrix.config.package_ext}}
          if-no-files-found: error

  # Native arm64 runner with a Debian bookworm container. This replaces the
  # QEMU chroot into a 2022 Raspberry Pi OS (bullseye) image, which can no
  # longer install packages now that bullseye is past end of life. Raspberry
  # Pi OS is Debian-based and -DRPI=1 only changes the default config, so a
  # bookworm arm64 build is the equivalent package.
  build_rpi:
    name: Raspberry Pi
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false

    # Through mirror.gcr.io, as the Linux job's image.
    container:
      image: mirror.gcr.io/library/debian:bookworm

    env:
      CMAKE_BUILD_TYPE: Release

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: apt update && apt install -y build-essential file git cmake pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libinih-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=/usr -DPACKAGE=DEB -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64 -DRPI=1
          cmake --build build --target package --config ${{env.CMAKE_BUILD_TYPE}}
          ctest --test-dir build --output-on-failure

      - name: Show package metadata
        run: dpkg-deb -f build/*.deb Package Version Architecture Maintainer Depends Homepage

      - name: Check the icon library is in the package
        run: |
          contents=$(dpkg-deb -c build/*.deb)
          for want in usr/share/streamflex/assets/icons/library/icons.ini usr/share/streamflex/assets/icons/library/brands/NOTICE.md usr/share/streamflex/assets/icons/library/generic/apps.svg; do
            grep -q "\./$want\$" <<< "$contents" || { echo "::error::$want is not in the package"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload package
        with:
          name: Raspberry Pi build
          path: build/*.deb
          if-no-files-found: error

  # Arch Linux package built with makepkg from the PKGBUILD that
  # `cmake -DPACKAGE=ARCH` generates from config/PKGBUILD.in. The PKGBUILD
  # builds from a local source tarball, which `git archive` produces here.
  # makepkg refuses to run as root, so the build runs as an unprivileged user.
  build_arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    # Through mirror.gcr.io, Google's public Docker Hub mirror, as above.
    container:
      image: mirror.gcr.io/library/archlinux:latest

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cmake sdl2 sdl2_image sdl2_ttf libinih

      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -B build -DPACKAGE=ARCH
          git archive --format=tar.gz --prefix=streamflex/ -o build/streamflex.tar.gz HEAD
          useradd --create-home builder
          chown -R builder build
          su builder -c "cd '$GITHUB_WORKSPACE/build' && makepkg"

      - name: Show package metadata
        run: pacman -Qip build/*.pkg.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload package
        with:
          name: Arch Linux build
          path: build/*.pkg.tar.zst
          if-no-files-found: error

  # Generated library files are current, every file is listed, and brand art fits the shared outline
  library_check:
    name: Icon library
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned so requirements.txt's wheel hash (CPython 3.12, x86-64) keeps matching when the runner image moves
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the icon library
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r branding/library/requirements.txt
          .venv/bin/python -m unittest discover -s branding/library -p "test_*.py" -v
          .venv/bin/python branding/library/check-library.py

  # The lines a change adds and its commit messages use American spelling, as every repo's CI
  # checks with the central gate (bilbospocketses/american-spelling), pinned by commit. Its
  # allow list is central too: no allow file of ours exists. The gate refuses a shallow clone,
  # so this checkout has the full history, and it reads only what was added since the
  # merge-base with the base branch
  spelling:
    name: American spelling
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base branch
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}

      - name: Check out the gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bilbospocketses/american-spelling
          ref: 21ed7e5524c511d9ee584778d42b72e6ddaeba86 # v1.0.2
          path: .american-spelling
          persist-credentials: false

      - name: Check American spelling
        run: python .american-spelling/check-american-spelling.py --repo . --base "origin/${BASE}" --repo-slug "${SLUG}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          SLUG: ${{ github.repository }}

  # The unit tests again, built with AddressSanitizer and UBSan and the extra warnings, as the
  # local unit leg (CONTRIBUTING.md) runs them: the Linux job's Release build has no sanitizer, so
  # a test that reads before an array or a freed slot passes there when the memory happens to
  # read as expected. It runs in the Debian headless image, as `tester` (root ignores the file
  # permissions some tests rely on), with address randomization off (setarch -R), which GCC 12's
  # ASan needs and Docker's default seccomp profile refuses. A compiler warning in our code, a
  # failed test or a sanitizer report (UBSan halts on its first) fails it.
  unit_sanitizers:
    name: Unit tests (ASan, UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the test image
        run: docker build -t streamflex-test-debian -f tests/headless/Dockerfile tests/headless

      - name: Build and run the unit tests
        run: |
          docker run --rm -i --security-opt seccomp=unconfined -v "$GITHUB_WORKSPACE:/src:ro" \
            streamflex-test-debian bash -s <<'EOF'
          set -u
          rm -rf /work; mkdir -p /work
          tar -C /src --exclude=./build --exclude=./.git -cf - . | tar -C /work -xf -
          chown -R tester /work
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          su tester -c "cmake -S /work -B /work/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='$flags' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' -DEXTRA_WARNINGS=ON" > /tmp/configure.log 2>&1 \
            || { echo "::error::CMake configure failed"; cat /tmp/configure.log; exit 2; }
          su tester -c "cmake --build /work/build -j$(nproc)" > /tmp/build.log 2>&1 \
            || { echo "::error::The build failed"; cat /tmp/build.log; exit 2; }
          ours=$(grep -iE 'warning:' /tmp/build.log | grep -vE '^g?make(\[[0-9]+\])?: ' | grep -v '^/work/src/external/')
          if [ -n "$ours" ]; then echo "::error::Compiler warnings outside src/external"; echo "$ours"; exit 1; fi
          su tester -c "UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 setarch $(uname -m) -R ctest --test-dir /work/build --output-on-failure"
          EOF

  # What only a running launcher shows: the settings screen, key handling and startup paths,
  # driven by key presses under a virtual display (tests/headless). It runs in its own container
  # because the harness turns off address randomization for ASan (setarch -R), which Docker's
  # default seccomp profile refuses. One image per distro: Debian, and Fedora, whose SDL2 is
  # sdl2-compat (SDL2's API over SDL3) rather than SDL2 itself. One run.sh serves both; what
  # differs between them is detected, not named.
  # A pass (every check, plain or with LeakSanitizer on) is too long for one job, so each runs in
  # 2 shards, one job each, as run-shards.ps1 does locally: run.sh <label> [leaks] K/2 runs shard
  # K, and headless_merge adds a pass's two shard consoles up into its one result. A shard alone
  # is not the pass: only the merge is. Scrollfail runs in each distro's plain shard 1, after the
  # shard. A failed shard fails this job, and with it build-and-test; fail-fast is off so the
  # other shards still report.
  headless:
    name: Headless (${{ matrix.distro }}, ${{ matrix.pass }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    # A backstop for a hang the harness helpers' own timeouts miss (GitHub's default is 6 hours).
    # A shard took 25 to 28 minutes locally on 3 CPUs (2026-10-08), with its own build. On GitHub
    # (run 37801014279) the plain shards took about 26 minutes and the leak shards about 27 to 30,
    # all in parallel, image build and scrollfail included; 60 minutes is about twice the measured
    # GitHub shard
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [Debian, Fedora]
        pass: [plain, leaks]
        shard: [1, 2]
        include:
          - distro: Debian
            key: debian
            dockerfile: Dockerfile
            image: streamflex-test-debian
          - distro: Fedora
            key: fedora
            dockerfile: Dockerfile.fedora
            image: streamflex-test-fedora
    env:
      DOCKERFILE: ${{ matrix.dockerfile }}
      IMAGE: ${{ matrix.image }}
      PASS: ${{ matrix.pass }}
      SHARD: ${{ matrix.shard }}
      LABEL: ci-${{ matrix.key }}-${{ matrix.pass }}-s${{ matrix.shard }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the test image
        id: build_image
        run: docker build -t "$IMAGE" -f "tests/headless/$DOCKERFILE" tests/headless

      # The console is kept under a name of its own, which the merge reads: the SHARD lines in it
      # are how merge.py knows the two shards make one complete run
      - name: Run the shard
        run: |
          mkdir -p "$RUNNER_TEMP/headless" "$RUNNER_TEMP/console"
          mode=()
          if [ "$PASS" = leaks ]; then mode=(leaks); fi
          docker run --rm --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/headless:/out" \
            "$IMAGE" bash /src/tests/headless/run.sh "$LABEL" "${mode[@]}" "$SHARD/2" 2>&1 \
            | tee "$RUNNER_TEMP/console/$LABEL.console.log"

      # Item 11's injected fault, a run of its own with no shards. It runs even when the shard
      # failed, so one run shows every failure, but not without an image to run in
      - name: Run scrollfail
        if: (success() || failure()) && steps.build_image.outcome == 'success' && matrix.pass == 'plain' && matrix.shard == 1
        run: |
          mkdir -p "$RUNNER_TEMP/headless"
          docker run --rm --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/headless:/out" \
            "$IMAGE" bash /src/tests/headless/run.sh "ci-${{ matrix.key }}-scrollfail" scrollfail

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload the shard's console
        if: (success() || failure()) && steps.build_image.outcome == 'success'
        with:
          name: headless console ${{ matrix.key }}-${{ matrix.pass }}-s${{ matrix.shard }}
          path: ${{ runner.temp }}/console/${{ env.LABEL }}.console.log
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload the logs of a failed run
        if: failure()
        with:
          name: Headless (${{ matrix.distro }}, ${{ matrix.pass }}, shard ${{ matrix.shard }}) logs
          path: ${{ runner.temp }}/headless

  # One job per distro and pass: merge.py adds the pass's two shard consoles up, and fails when
  # a check failed or leaked, or when they are not one complete run (a shard missing or given
  # twice, a check file run in neither shard or in both, a shard cut short). It runs when a
  # shard failed too, so the merged result shows; a shard whose console never came is missing.
  headless_merge:
    name: Headless (${{ matrix.distro }}, ${{ matrix.pass }})
    runs-on: ubuntu-24.04
    needs: [headless]
    if: always()
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        distro: [Debian, Fedora]
        pass: [plain, leaks]
        include:
          - distro: Debian
            key: debian
          - distro: Fedora
            key: fedora
    env:
      LEG: ci-${{ matrix.key }}-${{ matrix.pass }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each console has a name of its own, so the two land side by side however they are laid out
      - name: Download the shard consoles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: headless console ${{ matrix.key }}-${{ matrix.pass }}-s*
          path: ${{ runner.temp }}/console
          merge-multiple: true

      - name: Merge the shards
        run: |
          mkdir -p "$RUNNER_TEMP/console"
          mapfile -t consoles < <(find "$RUNNER_TEMP/console" -type f -name '*.console.log' | sort)
          echo "Shard consoles: ${consoles[*]:-none}"
          python3 tests/headless/merge.py --leg "$LEG" "${consoles[@]}"

  # Single required status check for the master branch ruleset. It passes only when every
  # platform build, the icon library check, the spelling check, the sanitized unit tests, every
  # headless shard and every merge succeeded;
  # `if: always()` makes it report a failure (rather than being skipped) when a job fails or is
  # canceled.
  build-and-test:
    runs-on: ubuntu-24.04
    needs: [build_windows, build_linux, build_rpi, build_arch, library_check, spelling, unit_sanitizers, headless, headless_merge]
    if: always()
    steps:
      - name: Check platform builds
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Build results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r)"
              exit 1
            fi
          done

  # Publishes the GitHub release when a v* tag is pushed. Every other run is a
  # dry run: it collects the packages and release notes exactly as a release
  # would, then skips attestation and publishing. v* tags cannot be deleted or
  # moved (tag ruleset), so a release job that breaks on the tag would cost a
  # version number; the dry run surfaces that on every PR instead.
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # Sigstore OIDC token for build provenance
      attestations: write   # store the build provenance attestations
      actions: write        # dispatch the docs site rebuild
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The packages only: each package's artifact is named "<platform> build", and the headless
      # shard consoles are artifacts of this run too
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "* build"
          path: dist
          merge-multiple: true

      # The project version in CMakeLists.txt is what the packages are named
      # after. On a tag it must equal the tag; on a dry run it is the version
      # the next tag will carry.
      - name: Check packages
        run: |
          version=$(grep -m1 -oE '^[[:space:]]*VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')
          if [ -z "$version" ]; then echo "::error::No project VERSION found in CMakeLists.txt"; exit 1; fi
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$IS_RELEASE" = "true" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version in CMakeLists.txt"
            exit 1
          fi
          ls -l dist
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::Expected 4 packages (Windows, Debian, Raspberry Pi, Arch), found $count"
            exit 1
          fi
          for f in dist/*; do
            case "$(basename "$f")" in
              *"$version"*) ;;
              *) echo "::error::$f does not carry project version $version"; exit 1 ;;
            esac
          done

      # Release notes are the CHANGELOG.md section for the project version. A
      # dry run before that section exists falls back to [Unreleased].
      - name: Extract release notes from CHANGELOG.md
        run: |
          section="$PROJECT_VERSION"
          if [ "$IS_RELEASE" != "true" ] && ! grep -qF "## [$section]" CHANGELOG.md; then section="Unreleased"; fi
          awk -v s="$section" '
            index($0, "## [" s "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no entries under [$section]"
            exit 1
          fi
          cat release-notes.md

      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true

      # The docs site's download page links to the latest release's files, so
      # rebuild it now that this release exists. A release published with the
      # workflow token does not trigger other workflows; a dispatch does, and
      # it runs on the default branch, which the github-pages environment
      # requires for deploys.
      - name: Rebuild docs site
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f release_tag="$GITHUB_REF_NAME"
