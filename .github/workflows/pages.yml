# Documentation site: builds docs/ with Jekyll and deploys it to GitHub Pages
# at https://bilbospocketses.github.io/streamflex/.
#
# This replaces GitHub's built-in "pages build and deployment" workflow so
# every action is SHA-pinned like the rest of the repo (sha_pinning_required).
# Pages is configured with build_type=workflow.
#
# Pull requests that touch docs/ build the site without deploying it, so a
# broken page is caught before it merges. This is not a required check.
#
# The download page links to the files of the latest published release, read
# from the API at build time. The Release job in build.yml dispatches this
# workflow with the new tag once a release is published, so the site never
# links to a release that does not exist yet.

name: Docs site

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "assets/icons/library/**"
      - "branding/library/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "assets/icons/library/**"
      - "branding/library/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to link the download page to (default: the latest release)"
        required: false
        type: string

permissions:
  contents: read

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Writes docs/_data/release.json, which download.md reads. The release
      # object's own assets array can lag behind the upload, so the files are
      # read from the release's assets collection instead.
      - name: Read release for the download page
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_tag '$RELEASE_TAG' is not vX.Y.Z"; exit 1
            fi
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          else
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          fi
          tag=$(jq -r .tag_name <<< "$release")
          id=$(jq -r .id <<< "$release")
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$tag' is not vX.Y.Z"; exit 1
          fi
          assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
            --jq '.[] | select(.state == "uploaded") | {name, url: .browser_download_url}' | jq -s .)
          jq -n --arg tag "$tag" --argjson assets "$assets" '
            def pick($re): [$assets[] | select(.name | test($re))]
              | if length == 1 then .[0]
                else error("release \($tag) needs exactly one asset matching \($re), found \(length)") end;
            # The Fedora tarball, first published with v0.6.0: null for a release before it, which
            # download.md then leaves out
            def pick_since($re): [$assets[] | select(.name | test($re))]
              | if length == 0 then null elif length == 1 then .[0]
                else error("release \($tag) has \(length) assets matching \($re), not one") end;
            { tag: $tag,
              version: ($tag | ltrimstr("v")),
              windows: pick("-win64\\.zip$"),
              deb_amd64: pick("_amd64\\.deb$"),
              arch: pick("-x86_64\\.pkg\\.tar\\.zst$"),
              deb_arm64: pick("_arm64\\.deb$"),
              fedora: pick_since("-fedora44-x86_64\\.tar\\.gz$") }' > docs/_data/release.json
          cat docs/_data/release.json

      # Writes docs/icons.md and copies the icons into the site; both are gitignored
      - name: Build the icon gallery
        run: python3 branding/library/build-gallery.py

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    name: Deploy docs site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
