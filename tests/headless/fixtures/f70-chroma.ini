; Transparent: the window is drawn in the chroma key color (the default, #010101), and each icon's
; art, inside a frame of its own color, holds that color or colors that scaling averages to it.
; 70-chroma.sh writes the icons; the 512 px PNGs are drawn at 256 px.
[General]
DefaultMenu=Main

[Background]
Mode=Transparent

[Layout]
Rows=1
Columns=3
IconSize=256

[Titles]
Enabled=false

[Main]
Entry1=RGBA;/home/tester/keyed/rgba.png;:quit
Entry2=RGB;/home/tester/keyed/rgb.png;:quit
Entry3=SVG;/home/tester/keyed/svg.svg;:quit
