; Check 48's launch case: Y (bound to :up, which a one-row menu of one tile does nothing with) is held
; through a launch's gap in polling; OK (Return, which selects as it is let go) launches `sleep 1`, which
; shows no window, so the launch lasts until the 3 s timeout, and the pad is not polled until then
[General]
DefaultMenu=Main
ApplicationTimeout=3

[Gamepad]
Enabled=true
ButtonY=:up

[Main]
Entry1=Launch;apps;sleep 1
