; The Wayland leg's driven runs (67-wayland.sh and 67-wayland-timing.sh), by the virtual pad, since
; Weston has no keys to press: A launches the first entry, a second Wayland client (another StreamFlex
; with its own HOME, and so its own log), whose PID the shell writes before it becomes the client; the
; D-pad's right moves to the second entry. The build path is run.sh's.
[General]
DefaultMenu=Main
ApplicationTimeout=30

[Gamepad]
ButtonA=:select
ButtonDPadRight=:right

[Main]
Entry1=Client;apps;echo $$ > /tmp/w67-client.pid && HOME=/tmp/w67-child exec /work/build/streamflex -c /src/tests/headless/fixtures/f67-client.ini
Entry2=Two;apps;:quit
