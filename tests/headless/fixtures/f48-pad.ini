; Check 48, the pad's repeat in wall time: D-pad Right steps along a row of three buttons, and A selects.
; The first button starts `sleep 1`, which shows no window, so the launch lasts until the 3 s timeout,
; and the pad is not polled until then.
[General]
DefaultMenu=Main
ApplicationTimeout=3

[Gamepad]
Enabled=true
ButtonDPadRight=:right
ButtonA=:select

[Main]
Entry1=Launch;apps;sleep 1
Entry2=Two;apps;:quit
Entry3=Three;apps;:quit
