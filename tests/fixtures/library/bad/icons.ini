; Every way a section can be wrong. Only dup, twice, unknown and ok survive loading.
[dup]
file = generic/ok.svg

[nofile]
title = No file

[abs]
file = /etc/hosts

[abs-win]
file = C:\Windows\win.ini

[escape]
file = ../outside.svg

[missing]
file = generic/missing.svg

[Bad_Name]
file = generic/ok.svg

[twice]
file = generic/ok.svg
file = generic/other.svg

[unknown]
file = generic/ok.svg
extra = ignored

[dup]
file = generic/other.svg

[ok]
file = generic/ok.svg
match = first, , second ,
match =  third
